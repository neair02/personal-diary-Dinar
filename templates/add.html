{% extends "base.html" %}

{% block content %}
<h2>✏ Новая запись</h2>

<form method="POST">
    <div>
        <label>Заголовок:</label>
        <input type="text" name="title" required>
    </div>
    <div>
        <label>Текст:</label>
        <textarea name="content" rows="10" required></textarea>
    </div>
    <div class="buttons">
        <button type="submit" class="save">Сохранить</button>
        <a href="{{ url_for('index') }}" class="cancel">Отмена</a>
    </div>
</form>
{% endblock %}
